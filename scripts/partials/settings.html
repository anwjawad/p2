    <!-- ============ Settings ============ -->
    <div id="settings-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="absolute inset-0 bg-slate-900/40" onclick="closeSettingsModal()"></div>
        <div class="relative w-full max-w-md bg-white rounded-2xl">
            <div class="flex items-center justify-between px-5 pt-5 pb-3">
                <h2 id="settings-title" class="text-lg font-bold">Settings</h2>
                <button onclick="closeSettingsModal()" class="icon-btn" aria-label="Close settings"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            </div>
            <div class="px-5 pb-5 grid gap-6">
                <fieldset class="grid gap-2">
                    <legend class="field-label mb-2">Appearance</legend>
                    <div class="segmented w-full" role="group" aria-label="Appearance">
                        <button class="flex-1 justify-center theme-btn" data-theme="system" onclick="setTheme('system')"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i> System</button>
                        <button class="flex-1 justify-center theme-btn" data-theme="light" onclick="setTheme('light')"><i class="fa-regular fa-sun" aria-hidden="true"></i> Light</button>
                        <button class="flex-1 justify-center theme-btn" data-theme="dark" onclick="setTheme('dark')"><i class="fa-regular fa-moon" aria-hidden="true"></i> Dark</button>
                    </div>
                </fieldset>

                <fieldset class="grid gap-2">
                    <legend class="field-label mb-2">Board density</legend>
                    <div class="segmented w-full" role="group" aria-label="Board density">
                        <button class="flex-1 justify-center density-btn" data-density="comfortable" onclick="setDensity('comfortable')">Comfortable</button>
                        <button class="flex-1 justify-center density-btn" data-density="compact" onclick="setDensity('compact')">Compact</button>
                    </div>
                </fieldset>

                <label class="flex items-center justify-between gap-4 p-3 rounded-xl border border-slate-200 cursor-pointer">
                    <span>
                        <span class="block font-semibold text-sm">Interface motion</span>
                        <span class="block text-xs text-slate-500">Turn off to remove sliding and fading effects.</span>
                    </span>
                    <input type="checkbox" id="btn-anim-toggle" class="w-5 h-5" onchange="toggleAnimations()">
                </label>

                <div class="grid gap-2 pt-4 border-t border-slate-200">
                    <h3 class="field-label">End of day</h3>
                    <p class="text-sm text-slate-500">Archives every patient on the board to Past rounds, then empties the board for tomorrow's list.</p>
                    <button onclick="triggerDailyReset()" id="btn-daily-reset" class="btn btn-danger-ghost btn-block">
                        <i class="fa-solid fa-box-archive" aria-hidden="true"></i> Archive and start a new day
                    </button>
                </div>

                <div class="grid gap-2 pt-4 border-t border-slate-200">
                    <h3 class="field-label">Connection</h3>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="testHistoryConnection()" class="btn btn-secondary btn-sm"><i class="fa-solid fa-stethoscope" aria-hidden="true"></i> Check connection</button>
                        <button onclick="signOut()" id="btn-sign-out" class="btn btn-ghost btn-sm" hidden><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Sign out on this device</button>
                    </div>
                    <p class="text-xs text-slate-500" id="settings-version"></p>
                </div>
            </div>
        </div>
    </div>
